name: Bug report / 问题反馈
description: Report reproducible firmware or hardware behavior / 反馈可复现的软硬件问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Chinese or English welcome. Do not include private pairing PINs or personal identifiers. 中英文均可，请勿提交私有码或个人标识。"
  - type: input
    id: revision
    attributes:
      label: Firmware and hardware revision / 固件与硬件版本
      placeholder: V6.5, board/model revision
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and mounting / 复现步骤与安装方式
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs, photos or measurements / 已去除隐私的日志、照片或测量
  - type: textarea
    id: environment
    attributes:
      label: Board, libraries, power source and OS / 开发板、库版本、电源与系统

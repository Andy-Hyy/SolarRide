name: Source checks / 源码检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publication checks / 发布文件检查
        run: python3 tools/check_public.py
      - name: Host regressions / 主机回归
        run: bash tools/test_host.sh
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned dependencies / 安装固定版本依赖
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit NeoPixel@1.15.5" "Adafruit MPU6050@2.2.9" "Adafruit BusIO@1.17.4" "Adafruit Unified Sensor@1.1.15"
      - name: Compile with disposable CI PIN / 使用临时 CI 配置编译
        run: |
          python3 tools/configure_pairing.py --pin 123456
          bash tools/build_firmware.sh
      - name: Remove CI pairing config / 清除 CI 配置
        if: always()
        run: rm -f firmware/SolarRider_BLE_OTA_V6_5_20261011/OTAPairing.h
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and test packet framing / 编译工具与协议自检
        run: bash tools/macos/build_tools.sh
